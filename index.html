<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EU-Caravan-Import-Kalkulator</title>
<meta name="description" content="Kosten für TÜV, Papiere, Export und Zulassung beim Wohnwagen-Import aus den Niederlanden kalkulieren.">
<script src="https://cdn.tailwindcss.com"></script>

<!-- Fest angepinnte, versionierte CDN-Links -->
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
</head>

<body class="bg-[#F8FAFC] text-slate-800 font-sans antialiased">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const GEBUEHREN = {
  HU_GEBREMST: 68.00,
  HU_UNGEBREMST: 45.90,
  TUEV_21_MAX: 175.00,
  AUFSCHLAG_BREMSE: 45.00,
  EXPORT_NL: 120.00,
  WUNSCHKENNZEICHEN: 12.80,
  HERSTELLER_DUPLIKAT_SCHAETZUNG: 150.00,
  TEMPO_100_GEBUEHR: 30.00,
  ZULASSUNG_PAUSCHAL: 42.00
};

const BUNDESLAENDER = [
  ["BW","Baden-Württemberg"],
  ["BY","Bayern"],
  ["BE","Berlin"],
  ["BB","Brandenburg"],
  ["HB","Bremen"],
  ["HH","Hamburg"],
  ["HE","Hessen"],
  ["MV","Mecklenburg-Vorpommern"],
  ["NI","Niedersachsen"],
  ["NRW","Nordrhein-Westfalen"],
  ["RP","Rheinland-Pfalz"],
  ["SL","Saarland"],
  ["SN","Sachsen"],
  ["ST","Sachsen-Anhalt"],
  ["SH","Schleswig-Holstein"],
  ["TH","Thüringen"]
];

const euro = (n) =>
  n.toLocaleString("de-DE", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

function CaravanKalkulator() {
  const [fahrzeugTyp, setFahrzeugTyp] = useState("standard");
  const [gewicht, setGewicht] = useState("gebremst");
  const [cocVorhanden, setCocVorhanden] = useState(true);
  const [keineUmbauten, setKeineUmbauten] = useState(true);
  const [bundesland, setBundesland] = useState("NRW");
  const [wunschkennzeichen, setWunschkennzeichen] = useState(false);
  const [tempo100, setTempo100] = useState(false);

  const [loading, setLoading] = useState(false);
  const [modalOpen, setModalOpen] = useState(false);
  const [modalCheckbox, setModalCheckbox] = useState(false);
  const [showResults, setShowResults] = useState(false);
  const [results, setResults] = useState(null);

  useEffect(() => {
    if (fahrzeugTyp === "leicht") {
      setGewicht("ungebremst");
    }
  }, [fahrzeugTyp]);

  useEffect(() => {
    if (typeof window !== "undefined") {
      const params = new URLSearchParams(window.location.search);
      const urlType = params.get("type");
      const urlCoc = params.get("coc");
      const urlWeight = params.get("weight");

      if (["standard", "falt", "leicht"].includes(urlType)) {
        setFahrzeugTyp(urlType);
      }

      if (urlCoc === "false") {
        setCocVorhanden(false);
      }

      if (["gebremst", "ungebremst"].includes(urlWeight)) {
        setGewicht(urlWeight);
      }
    }
  }, []);

  const handleFormSubmit = (e) => {
    e.preventDefault();
    setLoading(true);
    setShowResults(false);

    setTimeout(() => {
      setLoading(false);
      setModalOpen(true);
    }, 600);
  };

  const freischalten = () => {
    if (!modalCheckbox) return;

    const isVollabnahme = !keineUmbauten || !cocVorhanden;

    const tuevBest = isVollabnahme
      ? GEBUEHREN.TUEV_21_MAX
      : (
          gewicht === "gebremst"
            ? GEBUEHREN.HU_GEBREMST
            : GEBUEHREN.HU_UNGEBREMST
        );

    const bremsenAufschlag =
      (!isVollabnahme && gewicht === "gebremst")
        ? GEBUEHREN.AUFSCHLAG_BREMSE
        : 0;

    const tuevText = isVollabnahme
      ? "Vollabnahme nach § 21 StVZO zwingend erforderlich aufgrund fehlender Papiere oder Modifikationen"
      : (
          gewicht === "gebremst"
            ? "Reguläre Hauptuntersuchung (HU) für gebremste Anhänger"
            : "Reguläre Hauptuntersuchung (HU) für ungebremste Anhänger"
        );

    const bestCase = Math.ceil(
      tuevBest +
      bremsenAufschlag +
      GEBUEHREN.EXPORT_NL +
      (wunschkennzeichen ? GEBUEHREN.WUNSCHKENNZEICHEN : 0) +
      (tempo100 ? GEBUEHREN.TEMPO_100_GEBUEHR : 0) +
      GEBUEHREN.ZULASSUNG_PAUSCHAL
    );

    const worstCase = Math.ceil(
      GEBUEHREN.TUEV_21_MAX +
      GEBUEHREN.EXPORT_NL +
      GEBUEHREN.HERSTELLER_DUPLIKAT_SCHAETZUNG +
      (wunschkennzeichen ? GEBUEHREN.WUNSCHKENNZEICHEN : 0) +
      (tempo100 ? GEBUEHREN.TEMPO_100_GEBUEHR : 0) +
      GEBUEHREN.ZULASSUNG_PAUSCHAL
    );

    setResults({
      bestCase,
      worstCase,
      tuevText,
      tuevBest,
      bremsenAufschlag,
      isVollabnahme
    });

    setModalOpen(false);
    setShowResults(true);

    setTimeout(() => {
      document
        .getElementById("ergebnis-ansicht")
        ?.scrollIntoView({ behavior: "smooth" });
    }, 50);
  };

  return (
    <div className="min-h-screen bg-[#F4F1EA]">

      {/* HERO */}
      <header
        className="relative overflow-hidden"
        style={{
          background:
            "radial-gradient(120% 120% at 15% 10%, #1B3B2C 0%, #0D2318 55%, #081712 100%)"
        }}
      >
        <div className="max-w-5xl mx-auto px-6 md:px-10 pt-16 pb-14 md:pt-20 md:pb-16 relative grid md:grid-cols-[1.3fr_1fr] gap-10 items-center">

          <div>
            <div className="flex items-center gap-2 mb-6">
              <span className="w-6 h-px bg-[#A8E063]"></span>

              <span className="text-[#A8E063] font-bold text-[11px] tracking-[0.18em] uppercase">
                EU-Importkosten, klar kalkuliert
              </span>
            </div>

            <h1 className="text-4xl md:text-6xl font-black tracking-tight mb-5 leading-[1.05] text-[#F4F1EA]">
              Dein Wohnwagen
              <br />
              aus Holland.
              <span className="text-[#A8E063]">
                Ohne
                <br />
                Kostenüberraschung.
              </span>
            </h1>

            <p className="text-sm md:text-base text-[#D8DFD4]/80 max-w-md mb-8 leading-relaxed">
              Berechne TÜV, Papiere, Export und deutsche Zulassung in weniger
              als einer Minute – mit realistischem Best- und Worst-Case.
            </p>

            <div className="flex flex-wrap gap-x-6 gap-y-2 text-[11px] text-[#D8DFD4]/70">
              <span className="flex items-center gap-1.5">
                🛡️ Unabhängige Budgethilfe
              </span>

              <span className="flex items-center gap-1.5">
                ✓ Gebührenmatrix 2026
              </span>
            </div>
          </div>

          {/* ÜBERARBEITETE ROUTEN-KARTE */}
          <div className="relative rounded-[2rem] border border-white/10 bg-white/[0.04] backdrop-blur p-6 h-56 md:h-64 flex flex-col justify-between">

            <div className="flex justify-between items-start">
              <div>
                <span className="text-3xl font-black text-[#F4F1EA] block leading-none">
                  NL
                </span>

                <span className="text-[10px] text-[#D8DFD4]/60 uppercase tracking-wider">
                  Kaufen
                </span>
              </div>

              <div className="text-right">
                <span className="text-3xl font-black text-[#A8E063] block leading-none">
                  DE
                </span>

                <span className="text-[10px] text-[#D8DFD4]/60 uppercase tracking-wider">
                  Zulassen
                </span>
              </div>
            </div>

            {/* Route: Linie bewusst separat vom Textbereich */}
            <div className="relative flex items-center justify-center h-16">

              <div className="absolute left-2 right-2 top-1/2 -translate-y-1/2 border-t border-dashed border-white/20"></div>

              <div className="relative z-10 flex items-center justify-center w-14 h-14 rounded-full bg-[#0D2318] border border-white/10 shadow-lg">
                <span className="text-2xl">
                  🚐
                </span>
              </div>
            </div>

            <div className="text-center">
              <p className="text-xs text-[#D8DFD4]/70 leading-snug">
                Eine Strecke.
                <br />
                <span className="text-[#A8E063] font-semibold">
                  Alle Kosten im Blick.
                </span>
              </p>
            </div>
          </div>
        </div>
      </header>

      <div className="max-w-3xl mx-auto px-4 pt-10 pb-24">

        {/* INTRO */}
        <div className="bg-[#0B192C]/5 rounded-2xl p-5 mb-8 border border-[#0B192C]/10 text-xs text-slate-600 leading-relaxed">
          <span className="font-bold text-[#0B192C]">
            Der Markt für gebrauchte Caravans im EU-Ausland boomt
          </span>{" "}
          – besonders in den Niederlanden locken große Auswahl und attraktive
          Preise. Wer importieren möchte, stößt in Foren aber schnell auf ein
          Chaos aus Paragraphen und Halbwissen. Dieser Rechner liefert dir
          stattdessen sofort einen fundierten Richtwert, basierend auf den
          offiziellen Gebührenrahmen von TÜV und RDW (Stand August 2026).
        </div>

        {/* KALKULATOR */}
        <form
          onSubmit={handleFormSubmit}
          className="bg-white rounded-[2rem] p-6 md:p-10 shadow-xl shadow-[#0B192C]/5 border border-stone-200/60"
        >

          {/* FAHRZEUGTYP */}
          <div className="mb-6">
            <label className="block text-[#0B192C] font-bold text-xs uppercase mb-3">
              Fahrzeugtyp wählen
            </label>

            <div className="grid grid-cols-3 gap-3">
              {[
                ["standard", "🚐", "Caravan"],
                ["falt", "⛺", "Klappfix"],
                ["leicht", "🚗", "<750kg"]
              ].map(([val, icon, label]) => (
                <button
                  key={val}
                  type="button"
                  onClick={() => setFahrzeugTyp(val)}
                  className={`p-4 rounded-xl border-2 text-center text-xs transition-all relative ${
                    fahrzeugTyp === val
                      ? "border-[#0B192C] bg-[#0B192C] text-white font-bold shadow-md"
                      : "border-stone-200 text-slate-600 hover:border-stone-300"
                  }`}
                >
                  <span>
                    {icon} {label}
                  </span>

                  {val === "leicht" && fahrzeugTyp === "leicht" && (
                    <span className="absolute -top-2 left-1/2 -translate-x-1/2 bg-[#10B981] text-[#0B192C] text-[8px] font-black uppercase px-2 py-0.5 rounded-full whitespace-nowrap">
                      Auto-Match: Ungebremst
                    </span>
                  )}
                </button>
              ))}
            </div>
          </div>

          {/* GEWICHT */}
          <div className="mb-6">
            <label className="block text-[#0B192C] font-bold text-xs uppercase mb-2">
              Zulässiges Gesamtgewicht
            </label>

            <select
              value={gewicht}
              disabled={fahrzeugTyp === "leicht"}
              onChange={(e) => setGewicht(e.target.value)}
              className="w-full bg-stone-50 border rounded-xl p-3 text-xs font-semibold disabled:opacity-60"
            >
              <option value="gebremst">
                Gebremst (750 kg – 3,5 t)
              </option>

              <option value="ungebremst">
                Ungebremst (unter 750 kg)
              </option>
            </select>
          </div>

          {/* ZUSTAND & DOKUMENTE */}
          <div className="mb-6 bg-stone-50 p-4 rounded-xl border space-y-2">
            <label className="block text-[#0B192C] font-bold text-xs uppercase mb-1">
              Zustand &amp; Dokumente
            </label>

            <label className="flex items-center text-xs font-medium text-stone-600 cursor-pointer">
              <input
                type="checkbox"
                checked={cocVorhanden}
                onChange={(e) => setCocVorhanden(e.target.checked)}
                className="mr-2"
              />

              Das originale EU-COC-Papier liegt vor
            </label>

            <label className="flex items-center text-xs font-medium text-stone-600 cursor-pointer">
              <input
                type="checkbox"
                checked={keineUmbauten}
                onChange={(e) => setKeineUmbauten(e.target.checked)}
                className="mr-2"
              />

              Keine technischen Umbauten am Fahrzeug
            </label>
          </div>

          {/* BUNDESLAND */}
          <div className="mb-6">
            <label className="block text-[#0B192C] font-bold text-xs uppercase mb-2">
              Ziel-Bundesland (Zulassungsstelle)
            </label>

            <select
              value={bundesland}
              onChange={(e) => setBundesland(e.target.value)}
              className="w-full bg-stone-50 border rounded-xl p-3 text-xs font-semibold"
            >
              {BUNDESLAENDER.map(([code, name]) => (
                <option key={code} value={code}>
                  {name}
                </option>
              ))}
            </select>
          </div>

          {/* ZUSATZOPTIONEN */}
          <div className="mb-8 space-y-2">
            <label className="block text-[#0B192C] font-bold text-xs uppercase mb-2">
              Zusatzoptionen
            </label>

            <label className="flex items-center p-3 rounded-xl border text-xs font-semibold cursor-pointer">
              <input
                type="checkbox"
                checked={wunschkennzeichen}
                onChange={(e) => setWunschkennzeichen(e.target.checked)}
                className="mr-2"
              />

              Wunschkennzeichen inkl. Online-Vorabreservierung
              (+{euro(GEBUEHREN.WUNSCHKENNZEICHEN)} €)
            </label>

            <label className="flex items-center p-3 rounded-xl border text-xs font-semibold cursor-pointer">
              <input
                type="checkbox"
                checked={tempo100}
                onChange={(e) => setTempo100(e.target.checked)}
                className="mr-2"
              />

              Deutsche Tempo-100-Zulassung mit beantragen
              (+{euro(GEBUEHREN.TEMPO_100_GEBUEHR)} €)
            </label>
          </div>

          {/* SUBMIT */}
          <button
            type="submit"
            disabled={loading}
            className="w-full bg-[#10B981] hover:bg-[#0D9488] text-white font-extrabold py-4 rounded-xl shadow-lg transition-all text-sm disabled:opacity-70"
          >
            {loading
              ? "Daten-Abgleich mit Richtlinien läuft..."
              : "➔ Importkosten jetzt kalkulieren"}
          </button>
        </form>

        {/* MODAL */}
        {modalOpen && (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0B192C]/60 backdrop-blur-sm">
            <div className="bg-white rounded-[2rem] p-6 max-w-md w-full shadow-2xl">

              <h3 className="text-base font-bold text-[#0B192C] mb-2">
                🔒 Präzisions- &amp; Sicherheits-Check
              </h3>

              <p className="text-xs text-stone-500 mb-4">
                Um die Validität Ihrer Schätzung zu garantieren, gleicht unser
                System die Daten mit den Richtlinien von StVZO und
                EU-Typgenehmigungen (Stand 2026) ab. Da individuelle
                Fahrzeugzustände und lokale Amtsgebühren variieren können,
                dient dieses Ergebnis als fundierte Budget-Orientierung und
                ersetzt keine verbindliche Auskunft. Ihre Formulareingaben
                werden ausschließlich lokal in Ihrem Browser verarbeitet und
                nicht an unsere Server übertragen oder gespeichert. Details zu
                technisch bedingten Datenverarbeitungen (z. B. beim Laden
                externer Skripte) finden Sie in unserer{" "}
                <a href="#datenschutz" className="underline font-semibold">
                  Datenschutzerklärung
                </a>.
              </p>

              <label className="flex items-center text-xs font-bold text-stone-700 border-t border-b py-3 mb-4 cursor-pointer">
                <input
                  type="checkbox"
                  checked={modalCheckbox}
                  onChange={(e) => setModalCheckbox(e.target.checked)}
                  className="mr-2"
                />

                Ich bestätige die Richtigkeit meiner Angaben und habe den
                Hinweis auf regionale Gebührenschwankungen zur Kenntnis
                genommen.
              </label>

              <div className="flex gap-2">

                <button
                  type="button"
                  onClick={() => setModalOpen(false)}
                  className="flex-1 bg-stone-100 text-stone-600 py-2 rounded-lg text-xs font-bold"
                >
                  Abbrechen
                </button>

                <button
                  type="button"
                  onClick={freischalten}
                  disabled={!modalCheckbox}
                  className="flex-1 bg-[#0B192C] text-white py-2 rounded-lg text-xs font-bold disabled:opacity-30"
                >
                  ➔ Kalkulation sicher freischalten
                </button>

              </div>
            </div>
          </div>
        )}

        {/* ERGEBNIS */}
        {showResults && results && (
          <section
            id="ergebnis-ansicht"
            className="mt-10 bg-white rounded-[2rem] p-6 md:p-8 shadow-xl border border-stone-100"
          >

            {/* GAS-WARNUNG */}
            <div className="bg-[#F59E0B]/10 border-l-4 border-[#F59E0B] p-3 rounded-r-xl mb-6 text-xs flex gap-2">
              <span>⚠️</span>

              <div>
                <span className="font-bold text-[#0B192C]">
                  Gas-Warnung:
                </span>{" "}
                Holländischer Gas-Standard! In den Niederlanden fordert der
                TÜV oft den Umbau von flexiblen Schläuchen auf feste
                Schneidringverschraubungen. Planen Sie ca. 50–100 € zusätzliche
                Kosten beim Händler ein (nicht in der Summe enthalten).
              </div>
            </div>

            {/* BEST / WORST CASE */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">

              <div className="bg-[#10B981]/10 border-2 border-[#10B981] rounded-2xl p-6 text-center">
                <span className="text-[10px] font-bold text-[#0B192C]/70 uppercase block mb-1">
                  🟢 Minimaler Kostenrahmen
                </span>

                <span className="text-4xl font-black text-[#0B192C] block my-1">
                  {euro(results.bestCase)} €
                </span>

                <span className="text-[10px] text-[#10B981] font-bold uppercase">
                  Best-Case
                </span>
              </div>

              <div className="bg-[#F59E0B]/10 border-2 border-[#F59E0B] rounded-2xl p-6 text-center">
                <span className="text-[10px] font-bold text-[#0B192C]/70 uppercase block mb-1">
                  ⚠️ Maximaler Kostenrahmen
                </span>

                <span className="text-4xl font-black text-[#0B192C] block my-1">
                  {euro(results.worstCase)} €
                </span>

                <span className="text-[10px] text-[#F59E0B] font-bold uppercase">
                  Worst-Case
                </span>
              </div>

            </div>

            {/* DETAILS */}
            <div className="bg-stone-50 rounded-xl p-4 mb-6 text-xs text-stone-600 space-y-1">

              <p className="font-bold text-[#0B192C] mb-1">
                {results.tuevText}
              </p>

              <p>
                TÜV/Prüfung: {euro(results.tuevBest)} €
                {results.bremsenAufschlag > 0 &&
                  ` (+ ${euro(results.bremsenAufschlag)} € Bremsenaufschlag)`}
              </p>

              <p>
                RDW-Exportkennzeichen &amp; Versicherung:{" "}
                {euro(GEBUEHREN.EXPORT_NL)} €
              </p>

              <p>
                Pauschale Zulassungsgebühr:{" "}
                {euro(GEBUEHREN.ZULASSUNG_PAUSCHAL)} €
              </p>

              {wunschkennzeichen && (
                <p>
                  Wunschkennzeichen:{" "}
                  {euro(GEBUEHREN.WUNSCHKENNZEICHEN)} €
                </p>
              )}

              {tempo100 && (
                <p>
                  Tempo-100-Gutachten:{" "}
                  {euro(GEBUEHREN.TEMPO_100_GEBUEHR)} €
                </p>
              )}

              <p className="text-stone-400 pt-1">
                Worst-Case enthält zusätzlich eine Schätzung für ein
                COC-Herstellerduplikat (
                {euro(GEBUEHREN.HERSTELLER_DUPLIKAT_SCHAETZUNG)} €), falls
                Papiere fehlen.
              </p>

            </div>

            {/* EMPFEHLUNGEN */}
            <div className="space-y-3 mb-6">

              {/* COC */}
              {!cocVorhanden && (
                <div className="border rounded-xl p-4 text-xs flex items-center justify-between gap-3">

                  <span>
                    Fehlende Papiere oder kein COC-Datenblatt? Fordere eine
                    offizielle Zweitschrift direkt online beim Hersteller an.
                  </span>

                  <a
                    href="https://www.eurococ.eu/de/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="shrink-0 bg-[#0B192C] text-white px-3 py-2 rounded-lg font-bold text-[11px] hover:bg-[#142A43] transition-colors"
                  >
                    EUROCOC
                  </a>

                </div>
              )}

              {/* REIFEN / AMAZON */}
              {tempo100 && (
                <div className="border rounded-xl p-4 text-xs flex items-center justify-between gap-3">

                  <span>
                    Reifen älter als 6 Jahre? Für die 100-km/h-Plakette fordert
                    der TÜV jüngere Reifen mit passendem Geschwindigkeitsindex.
                  </span>

                  <a
                    href="https://www.amazon.de/s?k=wohnwagen+reifen&tag=caravanimport-21"
                    target="_blank"
                    rel="noopener noreferrer sponsored"
                    className="shrink-0 bg-[#0B192C] text-white px-3 py-2 rounded-lg font-bold text-[11px] hover:bg-[#142A43] transition-colors whitespace-nowrap"
                  >
                    Reifen bei Amazon prüfen →
                  </a>

                </div>
              )}

              {/* GUTACHTER */}
              <div className="bg-[#F59E0B]/10 border border-[#F59E0B]/30 rounded-xl p-4 text-xs">

                <p className="font-bold text-[#0B192C] mb-1">
                  🔎 Vor dem Kauf: Wohnwagen prüfen lassen
                </p>

                <p className="mb-2">
                  Ein Import-Fehlkauf im Ausland kann schnell teuer werden.
                  Ein unabhängiger Vor-Ort-Check kann insbesondere Dichtigkeit,
                  Rahmen, Achsen und Bremsen prüfen, bevor du den Kauf
                  abschließt.
                </p>

                <p className="text-stone-500">
                  Tipp: Suche nach einem mobilen Caravan-Sachverständigen in
                  der Nähe des Standorts des Wohnwagens und kläre Preis,
                  Leistungsumfang und Anfahrt vorab.
                </p>

              </div>

              {/* AMAZON PRODUKTBOXEN */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

                {/* ZUSATZSPIEGEL */}
                <a
                  href="https://www.amazon.de/s?k=caravan+zusatzspiegel&tag=caravanimport-21"
